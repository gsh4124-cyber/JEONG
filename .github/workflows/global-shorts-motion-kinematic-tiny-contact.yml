name: Motion Logic Kinematic Tiny Contact

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-kinematic-tiny-contact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
      - name: Make tiny contact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd global_shorts_render_lab/output/motion_logic_kinematic_proof
          ffmpeg -y -hide_banner -loglevel error -i motion_logic_kinematic_contact.jpg \
            -vf scale=180:240 -q:v 31 motion_logic_kinematic_contact_tiny.jpg
          base64 -w0 motion_logic_kinematic_contact_tiny.jpg > motion_logic_kinematic_contact_tiny.b64.txt
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/motion_logic_kinematic_proof/motion_logic_kinematic_contact_tiny.jpg \
                  global_shorts_render_lab/output/motion_logic_kinematic_proof/motion_logic_kinematic_contact_tiny.b64.txt
          git commit -m "render: add kinematic tiny contact [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
