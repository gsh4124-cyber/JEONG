name: Motion Logic Hybrid Camera V4

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-hybrid-camera-v4.yml"
      - "global_shorts_render_lab/motion_logic_kinematic_hybrid_camera_v4.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-logic-hybrid-camera-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 1, end: 7, part: "a"}
          - {start: 9, end: 15, part: "b"}
          - {start: 17, end: 23, part: "c"}
          - {start: 25, end: 31, part: "d"}
          - {start: 33, end: 39, part: "e"}
          - {start: 41, end: 49, part: "f"}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: global-shorts-render-lab, fetch-depth: 0}
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget xz-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender-5.2.2-linux-x64.tar.xz
      - name: Render
        run: |
          mkdir -p chunk
          ./blender-5.2.2-linux-x64/blender --background --python global_shorts_render_lab/motion_logic_kinematic_hybrid_camera_v4.py -- chunk ${{ matrix.start }} ${{ matrix.end }} 2
      - name: Persist
        run: |
          OUT="global_shorts_render_lab/output/motion_logic_hybrid_camera_v4_parts/${{ matrix.part }}"
          rm -rf "$OUT"; mkdir -p "$OUT"; cp chunk/* "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"; git commit -m "render: Motion Logic hybrid camera v4 part ${{ matrix.part }} [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin global-shorts-render-lab
            git rebase origin/global-shorts-render-lab
            if git push origin HEAD:global-shorts-render-lab; then exit 0; fi
            git rebase --abort || true; sleep 3
          done
          exit 1

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: global-shorts-render-lab, fetch-depth: 0}
      - name: Assemble tiny proof
        run: |
          git pull --rebase origin global-shorts-render-lab
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p seq
          i=0
          while IFS= read -r f; do cp "$f" "seq/frame_$(printf '%04d' "$i").png"; i=$((i+1)); done < <(find global_shorts_render_lab/output/motion_logic_hybrid_camera_v4_parts -name 'frame_*.png' | sort)
          ffmpeg -y -hide_banner -loglevel error -framerate 9 -i seq/frame_%04d.png -vf "minterpolate=fps=18:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1" -an -c:v libx264 -crf 27 -preset medium -pix_fmt yuv420p motion_logic_hybrid_camera_v4.mp4
          ffmpeg -y -hide_banner -loglevel error -i motion_logic_hybrid_camera_v4.mp4 -vf "fps=6,scale=90:160,tile=6x3" -frames:v 1 -q:v 25 motion_logic_hybrid_camera_v4_contact.jpg
      - name: Persist final
        run: |
          OUT=global_shorts_render_lab/output/motion_logic_hybrid_camera_v4
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp motion_logic_hybrid_camera_v4.mp4 motion_logic_hybrid_camera_v4_contact.jpg "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"; git commit -m "render: Motion Logic hybrid camera v4 [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
