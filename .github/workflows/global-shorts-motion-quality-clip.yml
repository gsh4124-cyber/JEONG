name: Motion Logic Motion Proof Clip

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-quality-clip.yml"
      - "global_shorts_render_lab/motion_logic_quality_clip.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 24, end: 34, events: 1, part: "a"}
          - {start: 36, end: 46, events: 0, part: "b"}
          - {start: 48, end: 58, events: 0, part: "c"}
          - {start: 60, end: 70, events: 0, part: "d"}
          - {start: 72, end: 82, events: 0, part: "e"}
          - {start: 84, end: 90, events: 0, part: "f"}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget xz-utils \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
      - name: Download Blender
        run: |
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender-5.2.2-linux-x64.tar.xz
      - name: Render chunk
        run: |
          rm -rf chunk
          mkdir -p chunk
          ./blender-5.2.2-linux-x64/blender \
            global_shorts_render_lab/output/motion_logic_proxy/motion_logic_proxy.blend \
            --background \
            --python global_shorts_render_lab/motion_logic_quality_clip.py -- \
            chunk ${{ matrix.start }} ${{ matrix.end }} ${{ matrix.events }}
      - name: Persist chunk to branch
        run: |
          OUT="global_shorts_render_lab/output/motion_logic_motion_proof_parts/${{ matrix.part }}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp chunk/* "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "render: Motion Logic proof part ${{ matrix.part }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin global-shorts-render-lab
            git rebase origin/global-shorts-render-lab
            if git push origin HEAD:global-shorts-render-lab; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  assemble:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Refresh branch
        run: git pull --rebase origin global-shorts-render-lab
      - name: Build frame sequence and synced audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          rm -rf seq
          mkdir -p seq
          i=0
          while IFS= read -r f; do
            cp "$f" "seq/frame_$(printf '%04d' "$i").png"
            i=$((i+1))
          done < <(find global_shorts_render_lab/output/motion_logic_motion_proof_parts -name 'frame_*.png' | sort)
          test "$i" -ge 30
          cp global_shorts_render_lab/output/motion_logic_motion_proof_parts/a/events.json events.json
          python - <<'PY'
          import json, math, wave, struct
          fps_source=18
          start=24
          duration=(90-start+1)/fps_source
          sr=48000
          n=int(duration*sr)
          buf=[0.0]*n
          with open("events.json") as f:
              events=json.load(f)
          def tone(t,freq,amp,length,decay):
              s0=max(0,int(t*sr))
              ln=min(int(length*sr),n-s0)
              for j in range(ln):
                  x=j/sr
                  buf[s0+j]+=amp*math.sin(2*math.pi*freq*x)*math.exp(-decay*x)
          for idx,fr in enumerate(events.get("domino_frames",[])[:5]):
              tone((fr-start)/fps_source,230+40*idx,0.34,0.09,28)
          gf=70
          gt=(gf-start)/fps_source
          tone(gt,660,0.42,0.42,8)
          tone(gt+0.03,990,0.25,0.38,9)
          mx=max(1.0,max(abs(v) for v in buf))
          with wave.open("motion.wav","w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              frames=bytearray()
              for v in buf:
                  s=int(max(-1,min(1,v/mx))*32767)
                  frames.extend(struct.pack("<h",s))
              w.writeframes(frames)
          print(events)
          PY
      - name: Encode proof clip
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -framerate 9 -i seq/frame_%04d.png \
            -i motion.wav \
            -vf "minterpolate=fps=18:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1" \
            -shortest \
            -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium \
            -c:a aac -b:a 128k \
            motion_logic_motion_proof.mp4
          ffmpeg -y -hide_banner -loglevel error -i motion_logic_motion_proof.mp4 \
            -vf "select='eq(n,0)+eq(n,22)+eq(n,44)+eq(n,66)',scale=90:160,tile=4x1" \
            -frames:v 1 -q:v 25 motion_logic_motion_proof_contact.jpg
          base64 -w0 motion_logic_motion_proof_contact.jpg > motion_logic_motion_proof_contact.b64.txt
      - name: Persist final proof
        run: |
          git pull --rebase origin global-shorts-render-lab
          rm -rf global_shorts_render_lab/output/motion_logic_motion_proof
          mkdir -p global_shorts_render_lab/output/motion_logic_motion_proof
          cp motion_logic_motion_proof.mp4 \
             motion_logic_motion_proof_contact.jpg \
             motion_logic_motion_proof_contact.b64.txt \
             events.json \
             global_shorts_render_lab/output/motion_logic_motion_proof/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/motion_logic_motion_proof
          git commit -m "render: Motion Logic motion proof clip [skip ci]"
          git push origin HEAD:global-shorts-render-lab
