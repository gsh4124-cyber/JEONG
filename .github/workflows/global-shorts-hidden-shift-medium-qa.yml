name: Hidden Shift Medium Visual QA

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-hidden-shift-medium-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Build medium previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          OUT=global_shorts_render_lab/output/hidden_shift_poc
          for s in A B R; do
            ffmpeg -y -hide_banner -loglevel error -i "$OUT/hidden_shift_${s}.png" -vf scale=135:240 -q:v 27 "$OUT/${s}_medium.jpg"
            base64 -w0 "$OUT/${s}_medium.jpg" > "$OUT/${s}_medium.b64.txt"
          done
      - name: Persist
        run: |
          OUT=global_shorts_render_lab/output/hidden_shift_poc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "qa: add Hidden Shift medium visual previews [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
