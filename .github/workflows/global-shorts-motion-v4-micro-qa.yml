name: Motion Logic V4 Micro QA

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-v4-micro-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build micro QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd global_shorts_render_lab/output/motion_logic_quality_v4
          ffmpeg -y -hide_banner -loglevel error \
            -i v4_action.png -i v4_payoff.png \
            -filter_complex "[0:v]scale=54:96[a];[1:v]scale=54:96[b];[a][b]hstack=inputs=2[out]" \
            -map "[out]" -q:v 31 v4_contact_micro.jpg
          base64 -w0 v4_contact_micro.jpg > v4_contact_micro.b64.txt
          ls -lh v4_contact_micro.jpg
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/motion_logic_quality_v4/v4_contact_micro.jpg \
                  global_shorts_render_lab/output/motion_logic_quality_v4/v4_contact_micro.b64.txt
          git commit -m "render: add V4 micro QA [skip ci]"
          git fetch origin global-shorts-render-lab
          git rebase origin/global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
