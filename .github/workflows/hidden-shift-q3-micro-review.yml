name: Hidden Shift Q3 Micro Review

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/hidden-shift-q3-micro-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Build micro review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          IN=global_shorts_render_lab/output/hidden_shift_workbench_q3_final/hidden_shift_workbench_q3_final.mp4
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_q3_final
          ffmpeg -y -hide_banner -loglevel error \
            -ss 0.50 -i "$IN" -frames:v 1 -vf scale=60:107 -q:v 31 /tmp/a.jpg
          ffmpeg -y -hide_banner -loglevel error \
            -ss 4.50 -i "$IN" -frames:v 1 -vf scale=60:107 -q:v 31 /tmp/b.jpg
          ffmpeg -y -hide_banner -loglevel error \
            -ss 7.20 -i "$IN" -frames:v 1 -vf scale=60:107 -q:v 31 /tmp/c.jpg
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/a.jpg -i /tmp/b.jpg -i /tmp/c.jpg \
            -filter_complex "[0:v][1:v][2:v]hstack=inputs=3[out]" \
            -map "[out]" -q:v 31 "$OUT/q3_micro_review.jpg"
          base64 -w0 "$OUT/q3_micro_review.jpg" > "$OUT/q3_micro_review.b64.txt"
          wc -c "$OUT/q3_micro_review.jpg"
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/hidden_shift_workbench_q3_final/q3_micro_review.jpg \
                  global_shorts_render_lab/output/hidden_shift_workbench_q3_final/q3_micro_review.b64.txt
          git commit -m "qa: add Q3 micro review [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
