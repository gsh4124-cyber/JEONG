name: MorphMint Family C Fresh Candidate 003

on:
  workflow_dispatch:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/morphmint-family-c-003.yml"
      - "global_shorts_render_lab/morphmint_family_c_003.py"

permissions:
  contents: write

jobs:
  build_003:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          python3 -m pip install --quiet pillow numpy
      - name: Generate deterministic states, transitions and audio
        run: |
          rm -rf /tmp/morphmint003 && mkdir -p /tmp/morphmint003
          OUT=/tmp/morphmint003 python3 global_shorts_render_lab/morphmint_family_c_003.py
      - name: Encode exact final binary
        run: |
          set -e
          TMP=/tmp/morphmint003
          ffmpeg -y -hide_banner -loglevel error -loop 1 -i "$TMP/ceramic.png" -t 2.0 -r 30 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p "$TMP/c_hold.mp4"
          ffmpeg -y -hide_banner -loglevel error -framerate 30 -i "$TMP/t1/f_%03d.png" -t 0.8 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p "$TMP/t1.mp4"
          ffmpeg -y -hide_banner -loglevel error -loop 1 -i "$TMP/chrome.png" -t 2.0 -r 30 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p "$TMP/ch_hold.mp4"
          ffmpeg -y -hide_banner -loglevel error -framerate 30 -i "$TMP/t2/f_%03d.png" -t 0.8 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p "$TMP/t2.mp4"
          ffmpeg -y -hide_banner -loglevel error -loop 1 -i "$TMP/crystal.png" -t 2.4 -r 30 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p "$TMP/cr_hold.mp4"
          printf "file 'c_hold.mp4'\nfile 't1.mp4'\nfile 'ch_hold.mp4'\nfile 't2.mp4'\nfile 'cr_hold.mp4'\n" > "$TMP/concat.txt"
          OUT=global_shorts_render_lab/output/morphmint_material_shift_003
          mkdir -p "$OUT"
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i "$TMP/concat.txt" -i "$TMP/audio.wav" -c:v copy -c:a aac -b:a 160k -ar 48000 -ac 1 -movflags +faststart -t 8.0 "$OUT/MorphMint_MaterialShift_003_1080x1920.mp4"
          sha256sum "$OUT/MorphMint_MaterialShift_003_1080x1920.mp4" > "$OUT/SHA256.txt"
      - name: Persist generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/morphmint_material_shift_003
          git commit -m "asset: persist MorphMint candidate 003 exact binary [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
