name: MorphMint Family C Method2 Full Clip

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/morphmint-family-c-method2-clip.yml"
      - "global_shorts_render_lab/morphmint_family_c_method2_clip.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {chunk: 1, start: 1, end: 12}
          - {chunk: 2, start: 13, end: 24}
          - {chunk: 3, start: 25, end: 36}
          - {chunk: 4, start: 37, end: 48}
          - {chunk: 5, start: 49, end: 60}
          - {chunk: 6, start: 61, end: 72}
          - {chunk: 7, start: 73, end: 84}
          - {chunk: 8, start: 85, end: 96}
          - {chunk: 9, start: 97, end: 108}
          - {chunk: 10, start: 109, end: 120}
          - {chunk: 11, start: 121, end: 132}
          - {chunk: 12, start: 133, end: 144}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install Blender and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget xz-utils ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender-5.2.2-linux-x64.tar.xz
      - name: Render chunk
        run: |
          mkdir -p frames out
          ./blender-5.2.2-linux-x64/blender --background             --python global_shorts_render_lab/morphmint_family_c_method2_clip.py --             frames ${{ matrix.start }} ${{ matrix.end }}
          ffmpeg -y -hide_banner -loglevel error             -framerate 18 -start_number ${{ matrix.start }}             -i frames/frame_%04d.png             -frames:v 12 -c:v libx264 -pix_fmt yuv420p -crf 20 -preset veryfast             out/chunk_${{ matrix.chunk }}.mp4
      - name: Persist chunk
        run: |
          OUT=global_shorts_render_lab/output/morphmint_family_c_method2_clip/chunks
          mkdir -p "$OUT"
          cp out/chunk_${{ matrix.chunk }}.mp4 "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "render: MorphMint method2 chunk ${{ matrix.chunk }} [skip ci]"
          for n in 1 2 3 4 5 6; do
            git fetch origin global-shorts-render-lab
            git rebase origin/global-shorts-render-lab
            if git push origin HEAD:global-shorts-render-lab; then exit 0; fi
            git rebase --abort || true
            sleep 4
          done
          exit 1

  assemble:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          git pull --rebase origin global-shorts-render-lab
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble clip and procedural audio
        run: |
          ROOT=global_shorts_render_lab/output/morphmint_family_c_method2_clip
          mkdir -p "$ROOT/final"
          cat > /tmp/list.txt <<EOF
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_1.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_2.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_3.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_4.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_5.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_6.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_7.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_8.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_9.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_10.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_11.mp4'
          file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_12.mp4'
          EOF
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i /tmp/list.txt -c copy "$ROOT/final/morphmint_method2_silent.mp4"

          python - <<'PY'
          import wave,math,struct
          sr=48000; dur=8.0; n=int(sr*dur); buf=[0.0]*n
          def tone(t,f,a,l,d):
              s=int(t*sr); ln=min(int(l*sr),n-s)
              for j in range(ln):
                  x=j/sr
                  buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-d*x)
          def sweep(t,f0,f1,a,l):
              s=int(t*sr); ln=min(int(l*sr),n-s)
              for j in range(ln):
                  x=j/sr
                  f=f0+(f1-f0)*(x/l)
                  buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-4*x)
          sweep((28-1)/18,180,520,.16,1.7)
          tone((70-1)/18,620,.18,.12,24)
          sweep((86-1)/18,420,980,.18,1.6)
          tone((120-1)/18,980,.28,.44,8)
          tone((120-1)/18+.04,1470,.15,.32,10)
          mx=max(1,max(abs(x) for x in buf))
          with wave.open("/tmp/morphmint.wav","w") as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
              raw=bytearray()
              for x in buf: raw.extend(struct.pack("<h",int(max(-1,min(1,x/mx))*32767)))
              w.writeframes(raw)
          PY

          ffmpeg -y -hide_banner -loglevel error             -i "$ROOT/final/morphmint_method2_silent.mp4" -i /tmp/morphmint.wav -shortest             -c:v copy -c:a aac -b:a 128k -movflags +faststart             "$ROOT/final/morphmint_method2.mp4"

          ffmpeg -y -hide_banner -loglevel error             -i "$ROOT/final/morphmint_method2.mp4"             -vf "fps=1,scale=135:240,tile=8x1" -frames:v 1 -q:v 24             "$ROOT/final/morphmint_method2_sequence.jpg"

      - name: Encoded technical and A/V QA
        run: |
          python - <<'PY'
          import subprocess,json,wave,struct,hashlib,os
          path="global_shorts_render_lab/output/morphmint_family_c_method2_clip/final/morphmint_method2.mp4"
          probe=json.loads(subprocess.run([
            "ffprobe","-v","error","-show_entries",
            "format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate,start_time,duration",
            "-of","json",path],capture_output=True,text=True,check=True).stdout)
          wav="/tmp/decoded.wav"
          subprocess.run(["ffmpeg","-y","-hide_banner","-loglevel","error","-i",path,"-vn","-ac","1","-ar","48000",wav],check=True)
          with wave.open(wav,"rb") as w:
              sr=w.getframerate(); vals=struct.unpack("<"+"h"*w.getnframes(),w.readframes(w.getnframes()))
          hop=int(sr*.005); win=int(sr*.01); active=[]
          for s in range(0,len(vals)-win,hop):
              rms=(sum(v*v for v in vals[s:s+win])/win)**.5/32768
              if rms>.006: active.append(s/sr)
          ons=[]; prev=-99
          for t in active:
              if t-prev>.08: ons.append(t)
              prev=t
          expected=[(28-1)/18,(70-1)/18,(86-1)/18,(120-1)/18]
          matches=[]
          for et in expected:
              ot=min(ons,key=lambda x:abs(x-et))
              matches.append({"expected":round(et,4),"actual":round(ot,4),"delta_ms":round((ot-et)*1000,1)})
          v=next(s for s in probe["streams"] if s["codec_type"]=="video")
          a=next(s for s in probe["streams"] if s["codec_type"]=="audio")
          passed=(v.get("width")==360 and v.get("height")==640 and v.get("codec_name")=="h264" and a.get("codec_name")=="aac" and max(abs(m["delta_ms"]) for m in matches)<=55.6)
          out={"probe":probe,"sync":matches,"sha256":hashlib.sha256(open(path,"rb").read()).hexdigest(),"technical_qa":passed}
          with open("global_shorts_render_lab/output/morphmint_family_c_method2_clip/final/qa.json","w") as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not passed: raise SystemExit("technical QA failed")
          PY
      - name: Persist final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/morphmint_family_c_method2_clip/final
          git commit -m "render: MorphMint method2 full proof [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
