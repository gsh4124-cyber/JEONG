name: actions Odd Factory Recovery Visual Proof

on:
  workflow_dispatch:
    inputs:
      primary_blocker_evidence:
        description: 'Verified hwangje-vault Actions blocker evidence / reference'
        required: true
        type: string
      support_scope:
        description: 'diagnostic | recovery | temporary_support'
        required: true
        type: choice
        options: [diagnostic, recovery, temporary_support]
      return_to_primary_plan:
        description: 'How the result returns to hwangje-vault primary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  support-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate support-only contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Install headless runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1
      - name: Download Blender 5.2.2
        run: |
          set -euo pipefail
          mkdir -p .cache/blender
          curl -L --fail --retry 3 -o .cache/blender/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender
      - name: Render cheap 9:16 hook-reveal-payoff proof
        env:
          EGL_PLATFORM: surfaceless
        run: |
          set -euo pipefail
          .cache/blender/blender-5.2.2-linux-x64/blender --background --factory-startup --python global_shorts_factory/core_visual_proof_odd_factory.py
          grep -q ODD_FACTORY_VISUAL_PROOF_KEYFRAMES_RENDERED /tmp/core_visual_proof_odd_factory/result.txt
      - name: Technical proof precheck
        run: |
          set -euo pipefail
          test -s /tmp/core_visual_proof_odd_factory/frame_001_hook.png
          test -s /tmp/core_visual_proof_odd_factory/frame_016_reveal.png
          test -s /tmp/core_visual_proof_odd_factory/frame_030_payoff.png
      - name: Record support context
        run: |
          cat > /tmp/core_visual_proof_odd_factory/support_context.json <<EOF
          {"primary_blocker_evidence":"${{ inputs.primary_blocker_evidence }}","support_scope":"${{ inputs.support_scope }}","return_to_primary_plan":"${{ inputs.return_to_primary_plan }}","support_repository":"gsh4124-cyber/actions","role":"SUPPORT_RECOVERY_FALLBACK_ONLY","proof_mode":"3_KEYFRAME_VISUAL_GATE"}
          EOF
      - name: Upload recovery proof
        uses: actions/upload-artifact@v4
        with:
          name: actions-odd-factory-recovery-proof
          path: |
            /tmp/core_visual_proof_odd_factory/frame_001_hook.png
            /tmp/core_visual_proof_odd_factory/frame_016_reveal.png
            /tmp/core_visual_proof_odd_factory/frame_030_payoff.png
            /tmp/core_visual_proof_odd_factory/result.txt
            /tmp/core_visual_proof_odd_factory/support_context.json
          retention-days: 3
