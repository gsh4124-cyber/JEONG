name: JEONG Core Visual Proof - Odd Factory

on:
  push:
    branches: [main]
    paths:
      - 'global_shorts_factory/core_visual_proof_odd_factory.py'
      - '.github/workflows/core-visual-proof-odd-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1
      - name: Download Blender 5.2.2
        run: |
          mkdir -p .cache/blender
          curl -L --fail --retry 3 -o .cache/blender/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender
      - name: Render 2.5s 9:16 Visual Proof
        env:
          EGL_PLATFORM: surfaceless
        run: .cache/blender/blender-5.2.2-linux-x64/blender --background --factory-startup --python global_shorts_factory/core_visual_proof_odd_factory.py
      - name: Technical proof precheck
        run: |
          test -s /tmp/core_visual_proof_odd_factory/odd_factory_visual_proof.mp4
          test -s /tmp/core_visual_proof_odd_factory/frame_001_hook.png
          test -s /tmp/core_visual_proof_odd_factory/frame_032_reveal.png
          test -s /tmp/core_visual_proof_odd_factory/frame_060_payoff.png
          grep -q ODD_FACTORY_VISUAL_PROOF_RENDERED /tmp/core_visual_proof_odd_factory/result.txt
      - name: Upload proof for artifact-level QA
        uses: actions/upload-artifact@v4
        with:
          name: odd-factory-visual-proof
          path: /tmp/core_visual_proof_odd_factory/
          retention-days: 3
