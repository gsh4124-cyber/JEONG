name: JEONG Global Shorts Support Contract Check

on:
  workflow_dispatch:
    inputs:
      primary_blocker_evidence:
        description: 'Verified hwangje-vault Actions blocker evidence / reference'
        required: true
        type: string
      support_scope:
        description: 'diagnostic | recovery | temporary_support'
        required: true
        type: choice
        options:
          - diagnostic
          - recovery
          - temporary_support
      return_to_primary_plan:
        description: 'How the result returns to hwangje-vault primary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  support-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JEONG support-only contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Record support invocation context
        run: |
          mkdir -p /tmp/jeong_support
          cat > /tmp/jeong_support/support_context.json <<EOF
          {
            "marker": "JEONG_GLOBAL_SHORTS_SUPPORT_CONTRACT_PASS",
            "role": "SUPPORT_RECOVERY_FALLBACK_ONLY",
            "primary_repository": "gsh4124-cyber/hwangje-vault",
            "primary_blocker_evidence": "${{ inputs.primary_blocker_evidence }}",
            "support_scope": "${{ inputs.support_scope }}",
            "return_to_primary_plan": "${{ inputs.return_to_primary_plan }}",
            "production_owner_claimed": false
          }
          EOF
          cat /tmp/jeong_support/support_context.json
      - uses: actions/upload-artifact@v4
        with:
          name: jeong-global-shorts-support-context
          path: /tmp/jeong_support/support_context.json
