name: Global Shorts Factory Contract

on:
  push:
    branches: [main]
    paths:
      - "global_shorts_factory/**"
      - ".github/workflows/global-shorts-factory-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "global_shorts_factory/**"
      - ".github/workflows/global-shorts-factory-contract.yml"
      - "global_shorts_render_lab/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 8-stage factory contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Verify production adapters exist
        run: |
          test -f global_shorts_render_lab/github_public_runner/smoke_scene.py
          test -f .github/workflows/jeong-public-blender-smoke.yml
          echo "PRODUCTION_ADAPTERS_PRESENT"
      - name: Emit factory readiness proof
        run: |
          mkdir -p /tmp/global_shorts_factory
          cat > /tmp/global_shorts_factory/readiness.json <<'EOF'
          {
            "marker": "GLOBAL_SHORTS_FACTORY_CONTRACT_PASS",
            "pipeline": "00>01>02>03>04>05>06>07>00",
            "stage_00_03": "ChatGPT/web/vidIQ orchestration",
            "stage_04_05": "JEONG/GitHub Actions production+QA",
            "stage_06": "publishing connector",
            "stage_07": "YouTube/vidIQ performance retrieval",
            "schedule": "NOT_SET_BY_USER",
            "autonomous_timer": false
          }
          EOF
          cat /tmp/global_shorts_factory/readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: global-shorts-factory-readiness
          path: /tmp/global_shorts_factory/readiness.json
