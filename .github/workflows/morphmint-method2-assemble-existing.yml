name: MorphMint Method2 Assemble Existing Chunks

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/morphmint-method2-assemble-existing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify and assemble existing chunks
        run: |
          ROOT=global_shorts_render_lab/output/morphmint_family_c_method2_clip
          OUT=$ROOT/final
          rm -rf "$OUT"
          mkdir -p "$OUT"

          for i in $(seq 1 12); do
            test -s "$ROOT/chunks/chunk_$i.mp4"
            ffprobe -v error -select_streams v:0               -show_entries stream=width,height,r_frame_rate,duration               -of compact=p=0:nk=1 "$ROOT/chunks/chunk_$i.mp4"
          done

          : > /tmp/list.txt
          for i in $(seq 1 12); do
            echo "file '$GITHUB_WORKSPACE/$ROOT/chunks/chunk_$i.mp4'" >> /tmp/list.txt
          done

          ffmpeg -y -hide_banner -loglevel error             -f concat -safe 0 -i /tmp/list.txt -c copy             "$OUT/morphmint_method2_silent.mp4"

          python - <<'PY'
          import wave,math,struct
          sr=48000; dur=8.0; n=int(sr*dur); buf=[0.0]*n
          def tone(t,f,a,l,d):
              s=int(t*sr); ln=min(int(l*sr),n-s)
              for j in range(ln):
                  x=j/sr
                  buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-d*x)
          def sweep(t,f0,f1,a,l):
              s=int(t*sr); ln=min(int(l*sr),n-s)
              for j in range(ln):
                  x=j/sr
                  frac=min(1,max(0,x/l))
                  f=f0+(f1-f0)*frac
                  buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-4*x)
          sweep((28-1)/18,180,520,.16,1.7)
          tone((70-1)/18,620,.18,.12,24)
          sweep((86-1)/18,420,980,.18,1.6)
          tone((120-1)/18,980,.28,.44,8)
          tone((120-1)/18+.04,1470,.15,.32,10)
          mx=max(1,max(abs(x) for x in buf))
          with wave.open("/tmp/morphmint.wav","w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              raw=bytearray()
              for x in buf: raw.extend(struct.pack("<h",int(max(-1,min(1,x/mx))*32767)))
              w.writeframes(raw)
          PY

          ffmpeg -y -hide_banner -loglevel error             -i "$OUT/morphmint_method2_silent.mp4" -i /tmp/morphmint.wav -shortest             -c:v copy -c:a aac -b:a 128k -movflags +faststart             "$OUT/morphmint_method2.mp4"

      - name: Technical and encoded A/V QA
        run: |
          python - <<'PY'
          import subprocess,json,wave,struct,hashlib,os
          path="global_shorts_render_lab/output/morphmint_family_c_method2_clip/final/morphmint_method2.mp4"
          probe=json.loads(subprocess.run([
            "ffprobe","-v","error",
            "-show_entries","format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate,start_time,duration",
            "-of","json",path],capture_output=True,text=True,check=True).stdout)

          wav="/tmp/decoded.wav"
          subprocess.run(["ffmpeg","-y","-hide_banner","-loglevel","error","-i",path,"-vn","-ac","1","-ar","48000",wav],check=True)
          with wave.open(wav,"rb") as w:
              sr=w.getframerate(); vals=struct.unpack("<"+"h"*w.getnframes(),w.readframes(w.getnframes()))
          hop=int(sr*.005); win=int(sr*.01); active=[]
          for s in range(0,len(vals)-win,hop):
              rms=(sum(v*v for v in vals[s:s+win])/win)**.5/32768
              if rms>.006: active.append(s/sr)
          ons=[]; prev=-99
          for t in active:
              if t-prev>.08: ons.append(t)
              prev=t

          expected=[(28-1)/18,(70-1)/18,(86-1)/18,(120-1)/18]
          matches=[]
          for et in expected:
              ot=min(ons,key=lambda x:abs(x-et))
              matches.append({"expected":round(et,4),"actual":round(ot,4),"delta_ms":round((ot-et)*1000,1)})

          v=next(s for s in probe["streams"] if s["codec_type"]=="video")
          a=next(s for s in probe["streams"] if s["codec_type"]=="audio")
          dur=float(probe["format"]["duration"])
          passed=(v.get("width")==360 and v.get("height")==640 and v.get("codec_name")=="h264"
                  and a.get("codec_name")=="aac" and 7.7<=dur<=8.1
                  and max(abs(m["delta_ms"]) for m in matches)<=55.6)

          out={
            "probe":probe,
            "sync":matches,
            "sha256":hashlib.sha256(open(path,"rb").read()).hexdigest(),
            "technical_qa":passed
          }
          outp="global_shorts_render_lab/output/morphmint_family_c_method2_clip/final/qa.json"
          with open(outp,"w") as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          if not passed: raise SystemExit("technical QA failed")
          PY

      - name: Build exact-final visual QA contacts
        run: |
          ROOT=global_shorts_render_lab/output/morphmint_family_c_method2_clip/final
          ffmpeg -y -hide_banner -loglevel error -i "$ROOT/morphmint_method2.mp4"             -vf "fps=1,scale=135:240,tile=8x1" -frames:v 1 -q:v 24             "$ROOT/morphmint_method2_sequence.jpg"

          for spec in "ceramic:0.55" "shell:2.80" "chrome:4.05" "crystal:6.65" "final:7.55"; do
            n="${spec%%:*}"; t="${spec#*:}"
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$ROOT/morphmint_method2.mp4"               -frames:v 1 -vf scale=216:384 -q:v 26 "$ROOT/${n}.jpg"
          done

          ffmpeg -y -hide_banner -loglevel error             -i "$ROOT/ceramic.jpg" -i "$ROOT/shell.jpg" -i "$ROOT/chrome.jpg" -i "$ROOT/crystal.jpg" -i "$ROOT/final.jpg"             -filter_complex "[0:v][1:v][2:v][3:v][4:v]hstack=inputs=5[out]"             -map "[out]" -q:v 25 "$ROOT/morphmint_method2_review.jpg"

      - name: Persist final proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/morphmint_family_c_method2_clip/final
          git commit -m "render: assemble MorphMint method2 full proof from existing chunks [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
