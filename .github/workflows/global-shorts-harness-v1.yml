name: Global Shorts Harness V1 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'global_shorts_factory/harness_v1/**'
      - '.github/workflows/global-shorts-harness-v1.yml'

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Preserve support contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Unit tests
        working-directory: global_shorts_factory/harness_v1
        run: python -m unittest -v test_harness.py
      - name: Build reference Odd One Out scene plan
        run: |
          python global_shorts_factory/harness_v1/harness.py \
            global_shorts_factory/harness_v1/examples/odd_one_out_001.json \
            --out /tmp/harness_v1/scene_plan.json
          test -s /tmp/harness_v1/scene_plan.json
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render L1 three-keyframe Visual Proof
        run: |
          python global_shorts_factory/harness_v1/proof_renderer.py \
            global_shorts_factory/harness_v1/examples/odd_one_out_001.json \
            --out /tmp/harness_v1/proof
          test -s /tmp/harness_v1/proof/contact_sheet.png
      - name: Render full Odd One Out episode
        run: |
          python global_shorts_factory/harness_v1/full_renderer.py \
            global_shorts_factory/harness_v1/examples/odd_one_out_001.json \
            --out /tmp/harness_v1/render
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 15 -i /tmp/harness_v1/render/frames/frame_%04d.png \
            -i /tmp/harness_v1/render/audio.wav \
            -c:v libx264 -pix_fmt yuv420p -profile:v high -level 4.0 \
            -c:a aac -b:a 128k -shortest -movflags +faststart \
            /tmp/harness_v1/render/final.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate -of json \
            /tmp/harness_v1/render/final.mp4 > /tmp/harness_v1/render/technical_video.json
          ffprobe -v error -show_entries format=duration,size -of json \
            /tmp/harness_v1/render/final.mp4 > /tmp/harness_v1/render/technical_format.json
          ffmpeg -hide_banner -loglevel error -y -i /tmp/harness_v1/render/final.mp4 \
            -vf "select='eq(n,0)+eq(n,15)+eq(n,75)+eq(n,96)+eq(n,126)',scale=180:320,tile=5x1" \
            -frames:v 1 /tmp/harness_v1/render/review_sheet.jpg
          test -s /tmp/harness_v1/render/final.mp4
          test -s /tmp/harness_v1/render/review_sheet.jpg
      - name: Upload scene plan, Visual Proof, and full render
        uses: actions/upload-artifact@v4
        with:
          name: global-shorts-harness-v1-full-render
          path: |
            /tmp/harness_v1/scene_plan.json
            /tmp/harness_v1/proof
            /tmp/harness_v1/render/final.mp4
            /tmp/harness_v1/render/review_sheet.jpg
            /tmp/harness_v1/render/render_manifest.json
            /tmp/harness_v1/render/technical_video.json
            /tmp/harness_v1/render/technical_format.json
          retention-days: 3
