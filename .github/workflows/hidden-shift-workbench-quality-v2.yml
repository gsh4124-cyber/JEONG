name: Hidden Shift Workbench Quality V2

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/hidden-shift-workbench-quality-v2.yml"
      - "global_shorts_render_lab/hidden_shift_workbench_quality_v2.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hidden-shift-workbench-quality-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        frame: [1,72,73,132,146,162]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget xz-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender-5.2.2-linux-x64.tar.xz
      - name: Render frame
        run: |
          mkdir -p out
          ./blender-5.2.2-linux-x64/blender --background             --python global_shorts_render_lab/hidden_shift_workbench_quality_v2.py --             out ${{ matrix.frame }}
      - name: Persist frame
        run: |
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_quality_v2
          mkdir -p "$OUT"
          cp out/* "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "render: Hidden Shift workbench q2 frame ${{ matrix.frame }} [skip ci]"
          for n in 1 2 3 4 5 6; do
            git fetch origin global-shorts-render-lab
            git rebase origin/global-shorts-render-lab
            if git push origin HEAD:global-shorts-render-lab; then exit 0; fi
            git rebase --abort || true
            sleep 4
          done
          exit 1

  qa:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install QA tools
        run: |
          git pull --rebase origin global-shorts-render-lab
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Structural and composition QA
        run: |
          python - <<'PY'
          from PIL import Image,ImageChops,ImageStat
          import json,os
          root="global_shorts_render_lab/output/hidden_shift_workbench_quality_v2"
          a=Image.open(f"{root}/workbench_q2_0001.png").convert("RGB")
          b=Image.open(f"{root}/workbench_q2_0072.png").convert("RGB")
          c=Image.open(f"{root}/workbench_q2_0073.png").convert("RGB")

          pre=ImageChops.difference(a,b)
          p=pre.load(); pre_strong=0
          for y in range(pre.height):
            for x in range(pre.width):
              if max(p[x,y])>=28: pre_strong+=1
          pre_ratio=pre_strong/(a.width*a.height)

          d=ImageChops.difference(b,c)
          px=d.load(); mask=Image.new("L",d.size,0); mp=mask.load(); strong=0
          for y in range(d.height):
            for x in range(d.width):
              if max(px[x,y])>=28:
                mp[x,y]=255; strong+=1
          bbox=mask.getbbox()
          strong_ratio=strong/(a.width*a.height)
          bbox_ratio=0
          if bbox:
            x0,y0,x1,y1=bbox
            bbox_ratio=((x1-x0)*(y1-y0))/(a.width*a.height)

          # target should stay in a compact central-upper zone and no frame-edge changes.
          localized=bbox is not None and bbox[0]>int(a.width*.20) and bbox[2]<int(a.width*.82) and bbox[1]>int(a.height*.08) and bbox[3]<int(a.height*.68)
          brightness=ImageStat.Stat(a.convert("L")).mean[0]
          passed=pre_ratio<0.001 and localized and 0<strong_ratio<.08 and bbox_ratio<.20 and 28<brightness<190

          out="global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa"
          os.makedirs(out,exist_ok=True)
          result={
            "resolution":[a.width,a.height],
            "pre_change_strong_ratio":round(pre_ratio,6),
            "strong_change_bbox":bbox,
            "strong_change_ratio":round(strong_ratio,6),
            "strong_change_bbox_ratio":round(bbox_ratio,6),
            "localized_target_change":localized,
            "mean_luma":round(brightness,2),
            "structural_composition_qa":passed
          }
          with open(f"{out}/structural_qa.json","w") as f: json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          if not passed: raise SystemExit("quality structural QA failed")
          PY
      - name: Build final 1080x1920 candidate
        run: |
          ROOT=global_shorts_render_lab/output/hidden_shift_workbench_quality_v2
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa
          ffmpeg -y -hide_banner -loglevel error             -loop 1 -t 4 -i "$ROOT/workbench_q2_0001.png"             -loop 1 -t 3 -i "$ROOT/workbench_q2_0073.png"             -loop 1 -t 0.65 -i "$ROOT/workbench_q2_0132.png"             -loop 1 -t 0.70 -i "$ROOT/workbench_q2_0146.png"             -loop 1 -t 0.65 -i "$ROOT/workbench_q2_0162.png"             -filter_complex "[0:v]scale=1080:1920:flags=lanczos,unsharp=5:5:0.35:5:5:0,fps=18,setsar=1[v0];[1:v]scale=1080:1920:flags=lanczos,unsharp=5:5:0.35:5:5:0,fps=18,setsar=1[v1];[2:v]scale=1080:1920:flags=lanczos,unsharp=5:5:0.35:5:5:0,fps=18,setsar=1[v2];[3:v]scale=1080:1920:flags=lanczos,unsharp=5:5:0.35:5:5:0,fps=18,setsar=1[v3];[4:v]scale=1080:1920:flags=lanczos,unsharp=5:5:0.35:5:5:0,fps=18,setsar=1[v4];[v0][v1][v2][v3][v4]concat=n=5:v=1:a=0[v]"             -map "[v]" -c:v libx264 -profile:v high -level 4.1 -pix_fmt yuv420p -crf 18 -preset medium "$OUT/hidden_shift_workbench_q2_silent.mp4"
          python - <<'PY'
          import wave,math,struct
          sr=48000; dur=9.0; n=int(sr*dur); buf=[0.0]*n
          def tone(t,f,a,l,d):
            s=int(t*sr); ln=min(int(l*sr),n-s)
            for j in range(ln):
              x=j/sr
              buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-d*x)
          # soft observation ticks, hidden-change cue, reveal chord
          for t in (1.0,2.0,3.0,5.0,6.0):
            tone(t,620,.055,.055,36)
          tone(4.0,330,.14,.08,28)
          tone(7.0,820,.34,.42,8)
          tone(7.04,1230,.20,.34,10)
          tone(7.08,1640,.10,.28,11)
          mx=max(1.0,max(abs(x) for x in buf))
          with wave.open("hs_q2.wav","w") as w:
            w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
            raw=bytearray()
            for x in buf: raw.extend(struct.pack("<h",int(max(-1,min(1,x/mx))*32767)))
            w.writeframes(raw)
          PY
          ffmpeg -y -hide_banner -loglevel error             -i "$OUT/hidden_shift_workbench_q2_silent.mp4" -i hs_q2.wav -shortest             -c:v copy -c:a aac -b:a 160k -movflags +faststart             "$OUT/hidden_shift_workbench_q2_final.mp4"
      - name: Final encoded QA
        run: |
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa
          python - <<'PY'
          import subprocess,json,wave,struct,os,hashlib
          path="global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa/hidden_shift_workbench_q2_final.mp4"
          probe=json.loads(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate,start_time,duration","-of","json",path],capture_output=True,text=True,check=True).stdout)
          wav="/tmp/q2.wav"
          subprocess.run(["ffmpeg","-y","-hide_banner","-loglevel","error","-i",path,"-vn","-ac","1","-ar","48000",wav],check=True)
          with wave.open(wav,"rb") as w:
            sr=w.getframerate(); vals=struct.unpack("<"+"h"*w.getnframes(),w.readframes(w.getnframes()))
          hop=int(sr*.005); win=int(sr*.01); active=[]
          for s in range(0,len(vals)-win,hop):
            rms=(sum(v*v for v in vals[s:s+win])/win)**.5/32768
            if rms>.01: active.append(s/sr)
          ons=[]; prev=-99
          for t in active:
            if t-prev>.08: ons.append(t)
            prev=t
          matches=[]
          for et in (4.0,7.0):
            ot=min(ons,key=lambda x:abs(x-et))
            matches.append({"expected":et,"actual":round(ot,4),"delta_ms":round((ot-et)*1000,1)})
          streams=probe["streams"]
          video=next(s for s in streams if s["codec_type"]=="video")
          audio=next(s for s in streams if s["codec_type"]=="audio")
          h=hashlib.sha256(open(path,"rb").read()).hexdigest()
          passed=(video.get("width")==1080 and video.get("height")==1920 and video.get("codec_name")=="h264" and audio.get("codec_name")=="aac" and max(abs(m["delta_ms"]) for m in matches)<=55.6)
          result={"ffprobe":probe,"sync_matches":matches,"sha256":h,"technical_qa":passed}
          with open("global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa/final_technical_qa.json","w") as f: json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          if not passed: raise SystemExit("final technical QA failed")
          PY
          ffmpeg -y -hide_banner -loglevel error -i "$OUT/hidden_shift_workbench_q2_final.mp4"             -vf "fps=1,scale=135:240,tile=9x1" -frames:v 1 -q:v 22 "$OUT/final_sequence_contact.jpg"
          ffmpeg -y -hide_banner -loglevel error -i "$OUT/final_sequence_contact.jpg"             -vf scale=270:53 -q:v 31 "$OUT/final_sequence_contact_tiny.jpg"
          base64 -w0 "$OUT/final_sequence_contact_tiny.jpg" > "$OUT/final_sequence_contact_tiny.b64.txt"
      - name: Persist final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa
          git commit -m "render: Hidden Shift workbench quality v2 final candidate [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
