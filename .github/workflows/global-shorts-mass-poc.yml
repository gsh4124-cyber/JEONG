name: actions Global Shorts Recovery POC

on:
  workflow_dispatch:
    inputs:
      primary_blocker_evidence:
        description: 'Verified hwangje-vault Actions blocker evidence / reference'
        required: true
        type: string
      support_scope:
        description: 'diagnostic | recovery | temporary_support'
        required: true
        type: choice
        options:
          - diagnostic
          - recovery
          - temporary_support
      return_to_primary_plan:
        description: 'How the result returns to hwangje-vault primary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  support-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate support-only contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Install renderer
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render recovery episode
        run: python global_shorts_factory/mass_short_poc.py
      - name: Encode vertical MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 30 -i /tmp/global_shorts_mass_poc/frames/frame_%04d.png -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart /tmp/global_shorts_mass_poc/odd_one_out_poc.mp4
          test -s /tmp/global_shorts_mass_poc/odd_one_out_poc.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/global_shorts_mass_poc/odd_one_out_poc.mp4
      - name: Save QA frames
        run: |
          cp /tmp/global_shorts_mass_poc/frames/frame_0001.png /tmp/global_shorts_mass_poc/hook.png
          cp /tmp/global_shorts_mass_poc/frames/frame_0095.png /tmp/global_shorts_mass_poc/reveal.png
      - name: Record support context
        run: |
          cat > /tmp/global_shorts_mass_poc/support_context.json <<EOF
          {
            "primary_blocker_evidence": "${{ inputs.primary_blocker_evidence }}",
            "support_scope": "${{ inputs.support_scope }}",
            "return_to_primary_plan": "${{ inputs.return_to_primary_plan }}",
            "support_repository": "gsh4124-cyber/actions",
            "role": "SUPPORT_RECOVERY_FALLBACK_ONLY"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: actions-global-shorts-recovery-poc
          path: |
            /tmp/global_shorts_mass_poc/odd_one_out_poc.mp4
            /tmp/global_shorts_mass_poc/hook.png
            /tmp/global_shorts_mass_poc/reveal.png
            /tmp/global_shorts_mass_poc/support_context.json
          retention-days: 3
