name: Hidden Shift Workbench Q4 Market Edit

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/hidden-shift-workbench-q4-market.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          git pull --rebase origin global-shorts-render-lab

      - name: Build 8-second market-facing Q4
        run: |
          # Q3 source renders were pruned from active tree after finalization.
          # Restore only the three required source frames from the last commit that still contains them.
          SRC_COMMIT=72adebbd52c2d1404c18d268462183559cf379a5
          mkdir -p /tmp/q4src
          git show "$SRC_COMMIT:global_shorts_render_lab/output/hidden_shift_workbench_quality_v2/workbench_q2_0001.png" > /tmp/q4src/before.png
          git show "$SRC_COMMIT:global_shorts_render_lab/output/hidden_shift_workbench_quality_v2/workbench_q2_0073.png" > /tmp/q4src/after.png
          git show "$SRC_COMMIT:global_shorts_render_lab/output/hidden_shift_workbench_quality_v2/workbench_q2_0146.png" > /tmp/q4src/reveal.png

          OUT=global_shorts_render_lab/output/hidden_shift_workbench_q4_final
          rm -rf "$OUT"; mkdir -p "$OUT"

          # 0–1.95 observe | 1.95–2.09 blink | 2.09–4.30 compare
          # 4.30–7.72 reveal | 7.72–8.00 blink reset to invite replay.
          ffmpeg -y -hide_banner -loglevel error             -loop 1 -t 1.95 -i /tmp/q4src/before.png             -f lavfi -t 0.14 -i "color=c=black:s=720x1280:r=18"             -loop 1 -t 2.21 -i /tmp/q4src/after.png             -loop 1 -t 3.42 -i /tmp/q4src/reveal.png             -f lavfi -t 0.28 -i "color=c=black:s=720x1280:r=18"             -filter_complex "
              [0:v]fps=18,setsar=1[v0];
              [1:v]fps=18,setsar=1[vb1];
              [2:v]fps=18,setsar=1[v1];
              [3:v]fps=18,setsar=1[v2];
              [4:v]fps=18,setsar=1[vb2];
              [v0][vb1][v1][v2][vb2]concat=n=5:v=1:a=0,
              scale=1080:1920:flags=lanczos,
              unsharp=5:5:0.30:5:5:0,
              drawbox=x=120:y=72:w=840:h=116:color=black@0.42:t=fill:enable='lt(t,4.30)',
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
                text='SPOT THE CHANGE':
                fontsize=62:
                fontcolor=white:
                x=(w-text_w)/2:
                y=96:
                shadowcolor=black@0.7:
                shadowx=2:
                shadowy=3:
                enable='lt(t,4.30)'[v]"             -map "[v]" -c:v libx264 -profile:v high -level 4.1 -pix_fmt yuv420p -crf 18 -preset medium "$OUT/q4_silent.mp4"

          python - <<'PY'
          import wave,math,struct
          sr=48000; dur=8.; n=int(sr*dur); buf=[0.0]*n
          def tone(t,f,a,l,d):
              s=max(0,int(t*sr)); ln=min(int(l*sr),n-s)
              for j in range(ln):
                  x=j/sr; buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-d*x)
          # Observation pacing without music dependency.
          tone(.62,640,.045,.045,38)
          tone(1.28,640,.045,.045,38)
          tone(1.95,300,.17,.09,30)
          reveal=4.30
          tone(reveal,820,.38,.44,8)
          tone(reveal+.035,1230,.22,.36,10)
          tone(reveal+.075,1640,.12,.30,11)
          tone(7.72,280,.10,.08,32)
          mx=max(1.0,max(abs(v) for v in buf))
          with wave.open("q4.wav","w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              raw=bytearray()
              for v in buf: raw.extend(struct.pack("<h",int(max(-1,min(1,v/mx))*32767)))
              w.writeframes(raw)
          PY

          ffmpeg -y -hide_banner -loglevel error             -i "$OUT/q4_silent.mp4" -i q4.wav -shortest             -c:v copy -c:a aac -b:a 160k -movflags +faststart             "$OUT/hidden_shift_workbench_q4_final.mp4"

      - name: Final technical and structural QA
        run: |
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_q4_final
          python - <<'PY'
          import subprocess,json,wave,struct,hashlib,os
          path="global_shorts_render_lab/output/hidden_shift_workbench_q4_final/hidden_shift_workbench_q4_final.mp4"
          probe=json.loads(subprocess.run([
              "ffprobe","-v","error",
              "-show_entries","format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate,start_time,duration",
              "-of","json",path],capture_output=True,text=True,check=True).stdout)
          video=next(s for s in probe["streams"] if s["codec_type"]=="video")
          audio=next(s for s in probe["streams"] if s["codec_type"]=="audio")
          duration=float(probe["format"]["duration"])

          wav="/tmp/q4.wav"
          subprocess.run(["ffmpeg","-y","-hide_banner","-loglevel","error","-i",path,"-vn","-ac","1","-ar","48000",wav],check=True)
          with wave.open(wav,"rb") as w:
              sr=w.getframerate(); vals=struct.unpack("<"+"h"*w.getnframes(),w.readframes(w.getnframes()))
          hop=int(sr*.005); win=int(sr*.01)
          active=[]
          for s in range(0,len(vals)-win,hop):
              rms=(sum(v*v for v in vals[s:s+win])/win)**.5/32768
              if rms>.012: active.append(s/sr)
          ons=[]; prev=-99
          for t in active:
              if t-prev>.08: ons.append(t)
              prev=t

          expected=(1.95,4.30,7.72)
          matches=[]
          for et in expected:
              ot=min(ons,key=lambda x:abs(x-et))
              matches.append({"expected":et,"actual":round(ot,4),"delta_ms":round((ot-et)*1000,1)})

          h=hashlib.sha256(open(path,"rb").read()).hexdigest()
          passed=(
              video.get("width")==1080 and video.get("height")==1920
              and video.get("codec_name")=="h264"
              and audio.get("codec_name")=="aac"
              and 7.85<=duration<=8.15
              and max(abs(m["delta_ms"]) for m in matches)<=55.6
          )
          result={
              "candidate":"Hidden Shift Workbench Q4",
              "duration_seconds":duration,
              "resolution":[video.get("width"),video.get("height")],
              "video_codec":video.get("codec_name"),
              "audio_codec":audio.get("codec_name"),
              "event_sync":matches,
              "sha256":h,
              "technical_qa":passed
          }
          with open("global_shorts_render_lab/output/hidden_shift_workbench_q4_final/final_qa.json","w") as f: json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          if not passed: raise SystemExit("Q4 final technical QA failed")
          PY

          # Exact-final viewer-facing review frames.
          ffmpeg -y -hide_banner -loglevel error -ss 0.55 -i "$OUT/hidden_shift_workbench_q4_final.mp4" -frames:v 1             -vf "crop=1080:300:0:0,scale=360:100" -q:v 29 "$OUT/title_review.jpg"
          for spec in "before:0.55" "after:2.60" "reveal:4.80"; do
            n="${spec%%:*}"; t="${spec#*:}"
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$OUT/hidden_shift_workbench_q4_final.mp4" -frames:v 1               -vf "crop=620:980:230:300,scale=248:392" -q:v 29 "$OUT/${n}_review.jpg"
          done
          ffmpeg -y -hide_banner -loglevel error             -i "$OUT/before_review.jpg" -i "$OUT/after_review.jpg" -i "$OUT/reveal_review.jpg"             -filter_complex "[0:v][1:v][2:v]hstack=inputs=3[out]" -map "[out]" -q:v 29 "$OUT/state_review.jpg"
          ffmpeg -y -hide_banner -loglevel error -i "$OUT/hidden_shift_workbench_q4_final.mp4"             -vf "fps=2,scale=90:160,tile=4x4" -frames:v 1 -q:v 28 "$OUT/timeline_review.jpg"
          for f in title_review state_review timeline_review; do
            base64 -w0 "$OUT/${f}.jpg" > "$OUT/${f}.b64.txt"
          done

      - name: Build submission manifest
        run: |
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_q4_final
          python - <<'PY'
          import json
          qa=json.load(open("global_shorts_render_lab/output/hidden_shift_workbench_q4_final/final_qa.json"))
          manifest={
            "channel":{"name":"Hidden Shift","handle":"@hiddenshiftlab","upload_post_profile":"hidden-shift"},
            "asset":"hidden_shift_workbench_q4_final.mp4",
            "asset_sha256":qa["sha256"],
            "title":"What Changed on the Workbench? 👀 #Shorts",
            "description":"Watch closely. Something changes after the blink. Did you catch it before the reveal? #SpotTheDifference #VisualPuzzle #Shorts",
            "duration_seconds":8,
            "viewer_structure":{
              "observe_end":1.95,
              "hidden_swap_blink_end":2.09,
              "reveal_start":4.30,
              "loop_reset_blink_start":7.72
            },
            "publish_status":"NOT_PUBLISHED",
            "ready_status":"BENCHMARK_GATE_PENDING",
            "external_action_gate":"EMPEROR_APPROVAL_REQUIRED"
          }
          json.dump(manifest,open("global_shorts_render_lab/output/hidden_shift_workbench_q4_final/submission_manifest.json","w"),indent=2,ensure_ascii=False)
          PY

      - name: Persist Q4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/hidden_shift_workbench_q4_final
          git commit -m "render: Hidden Shift Workbench Q4 market-facing candidate [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
