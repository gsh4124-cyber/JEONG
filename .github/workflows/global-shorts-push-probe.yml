name: Global Shorts Push Probe

on:
  push:
    branches:
      - global-shorts-render-lab
    paths:
      - ".github/workflows/global-shorts-push-probe.yml"

permissions:
  contents: write

jobs:
  push-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit generated result
        run: |
          mkdir -p global_shorts_render_lab/output
          printf "runner-write-ok\n" > global_shorts_render_lab/output/runner_write_probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/runner_write_probe.txt
          git commit -m "test: runner write output [skip ci]"
          git push origin HEAD:global-shorts-render-lab
