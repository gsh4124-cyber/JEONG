name: Motion Logic Camera V3 Tiny QA

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-camera-v3-tiny-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
      - name: Build tiny QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          IN=global_shorts_render_lab/output/motion_logic_camera_follow_v3/motion_logic_camera_follow_v3.mp4
          OUT=global_shorts_render_lab/output/motion_logic_camera_follow_v3
          ffmpeg -y -hide_banner -loglevel error -i "$IN" \
            -vf "select='eq(n,0)+eq(n,16)+eq(n,32)+eq(n,48)',scale=90:160,tile=4x1" \
            -frames:v 1 -q:v 31 "$OUT/contact_v3_tiny.jpg"
          base64 -w0 "$OUT/contact_v3_tiny.jpg" > "$OUT/contact_v3_tiny.b64.txt"
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/motion_logic_camera_follow_v3/contact_v3_tiny.jpg \
                  global_shorts_render_lab/output/motion_logic_camera_follow_v3/contact_v3_tiny.b64.txt
          git commit -m "render: add camera v3 tiny QA [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
