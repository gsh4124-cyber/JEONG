name: Motion Logic Transfer Clips

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-transfer-clips.yml"
      - "global_shorts_render_lab/motion_logic_transfer_clip.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-logic-transfer-clips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: "bridge", start: 1, end: 9, part: "a"}
          - {variant: "bridge", start: 11, end: 19, part: "b"}
          - {variant: "bridge", start: 21, end: 29, part: "c"}
          - {variant: "bridge", start: 31, end: 39, part: "d"}
          - {variant: "bridge", start: 41, end: 49, part: "e"}
          - {variant: "bridge", start: 51, end: 54, part: "f"}
          - {variant: "counterweight", start: 1, end: 9, part: "a"}
          - {variant: "counterweight", start: 11, end: 19, part: "b"}
          - {variant: "counterweight", start: 21, end: 29, part: "c"}
          - {variant: "counterweight", start: 31, end: 39, part: "d"}
          - {variant: "counterweight", start: 41, end: 49, part: "e"}
          - {variant: "counterweight", start: 51, end: 54, part: "f"}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget xz-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender-5.2.2-linux-x64.tar.xz
      - name: Render chunk
        run: |
          mkdir -p chunk
          ./blender-5.2.2-linux-x64/blender --background \
            --python global_shorts_render_lab/motion_logic_transfer_clip.py -- \
            ${{ matrix.variant }} chunk ${{ matrix.start }} ${{ matrix.end }} 2
      - name: Persist chunk
        run: |
          OUT="global_shorts_render_lab/output/motion_logic_transfer_parts/${{ matrix.variant }}/${{ matrix.part }}"
          rm -rf "$OUT"; mkdir -p "$OUT"; cp chunk/* "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "render: transfer ${{ matrix.variant }} part ${{ matrix.part }} [skip ci]"
          for n in 1 2 3 4 5 6; do
            git fetch origin global-shorts-render-lab
            git rebase origin/global-shorts-render-lab
            if git push origin HEAD:global-shorts-render-lab; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1

  assemble:
    needs: render
    strategy:
      matrix:
        variant: ["bridge","counterweight"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Assemble
        run: |
          git pull --rebase origin global-shorts-render-lab
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          rm -rf seq; mkdir -p seq
          i=0
          while IFS= read -r f; do
            cp "$f" "seq/frame_$(printf '%04d' "$i").png"
            i=$((i+1))
          done < <(find "global_shorts_render_lab/output/motion_logic_transfer_parts/${{ matrix.variant }}" -name 'frame_*.png' | sort)
          test "$i" -ge 26
          python - <<'PY'
          import math,wave,struct,os
          variant=os.environ["VARIANT"]
          sr=48000; dur=54/18; n=int(sr*dur); buf=[0.0]*n
          def tone(t,f,a,l,d):
              s=max(0,int(t*sr)); ln=min(int(l*sr),n-s)
              for j in range(ln):
                  x=j/sr; buf[s+j]+=a*math.sin(2*math.pi*f*x)*math.exp(-d*x)
          if variant=="bridge":
              events=[(18,330),(24,470)]
          else:
              events=[(23,300),(30,520)]
          for fr,freq in events:
              tone((fr-1)/18,freq,0.34,0.10,25)
          tone((49-1)/18,780,0.42,0.38,8)
          tone((49-1)/18+0.035,1170,0.23,0.32,9)
          mx=max(1.0,max(abs(v) for v in buf))
          with wave.open("audio.wav","w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              raw=bytearray()
              for v in buf: raw.extend(struct.pack("<h",int(max(-1,min(1,v/mx))*32767)))
              w.writeframes(raw)
          PY
          ffmpeg -y -hide_banner -loglevel error \
            -framerate 9 -i seq/frame_%04d.png -i audio.wav \
            -vf "minterpolate=fps=18:mi_mode=mci:mc_mode=aobmc:me_mode=bidir:vsbmc=1" \
            -shortest -c:v libx264 -pix_fmt yuv420p -crf 23 -preset medium \
            -c:a aac -b:a 128k "${{ matrix.variant }}.mp4"
          ffmpeg -y -hide_banner -loglevel error -i "${{ matrix.variant }}.mp4" \
            -vf "select='eq(n,0)+eq(n,18)+eq(n,36)+eq(n,53)',scale=90:160,tile=4x1" \
            -frames:v 1 -q:v 29 "${{ matrix.variant }}_contact.jpg"
          ffmpeg -y -hide_banner -loglevel error -i "${{ matrix.variant }}.mp4" \
            -vf "scale=90:160,fps=9" -an -c:v libx264 -crf 35 -preset veryfast -pix_fmt yuv420p \
            "${{ matrix.variant }}_tiny.mp4"
        env:
          VARIANT: ${{ matrix.variant }}
      - name: Persist final
        run: |
          OUT="global_shorts_render_lab/output/motion_logic_transfer_final/${{ matrix.variant }}"
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "${{ matrix.variant }}.mp4" "${{ matrix.variant }}_contact.jpg" "${{ matrix.variant }}_tiny.mp4" "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "render: transfer ${{ matrix.variant }} full proof [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin global-shorts-render-lab
            git rebase origin/global-shorts-render-lab
            if git push origin HEAD:global-shorts-render-lab; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
