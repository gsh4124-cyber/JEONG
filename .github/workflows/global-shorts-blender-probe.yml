name: Global Shorts Blender Probe

on:
  push:
    branches:
      - global-shorts-render-lab
    paths:
      - ".github/workflows/global-shorts-blender-probe.yml"
      - "global_shorts_render_lab/PROBE_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blender-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget xz-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libegl1 libxkbcommon0 libsm6

      - name: Download Blender 5.2.2 LTS
        run: |
          wget -q https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender-5.2.2-linux-x64.tar.xz
          ./blender-5.2.2-linux-x64/blender --version

      - name: Create probe scene
        run: |
          cat > probe.py <<'PY'
          import bpy, os

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          bpy.ops.mesh.primitive_uv_sphere_add(segments=64, ring_count=32, location=(0, 0, 0))
          sphere = bpy.context.object
          mat = bpy.data.materials.new('SphereMat')
          mat.diffuse_color = (0.08, 0.35, 0.95, 1.0)
          mat.metallic = 0.85
          mat.roughness = 0.18
          sphere.data.materials.append(mat)

          bpy.ops.mesh.primitive_plane_add(size=12, location=(0, 0, -1.02))
          plane = bpy.context.object
          pmat = bpy.data.materials.new('Ground')
          pmat.diffuse_color = (0.025, 0.03, 0.045, 1.0)
          pmat.roughness = 0.35
          plane.data.materials.append(pmat)

          bpy.ops.object.light_add(type='AREA', location=(3.8, -4.0, 5.5))
          key = bpy.context.object
          key.data.energy = 1100
          key.data.shape = 'DISK'
          key.data.size = 4.0

          bpy.ops.object.light_add(type='AREA', location=(-3.5, 1.5, 3.2))
          fill = bpy.context.object
          fill.data.energy = 500
          fill.data.size = 3.5

          bpy.ops.object.light_add(type='AREA', location=(0.0, 3.5, 4.5))
          rim = bpy.context.object
          rim.data.energy = 800
          rim.data.size = 3.0

          bpy.ops.object.camera_add(location=(4.8, -6.0, 3.6))
          cam = bpy.context.object
          bpy.context.scene.camera = cam

          def look_at(obj, target=(0,0,0)):
              import mathutils
              direction = mathutils.Vector(target) - obj.location
              obj.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          look_at(cam, (0, 0, -0.1))

          scene = bpy.context.scene
          scene.render.engine = 'BLENDER_EEVEE'
          scene.render.resolution_x = 256
          scene.render.resolution_y = 256
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = 'PNG'
          scene.render.filepath = os.path.join(os.environ['GITHUB_WORKSPACE'], 'probe.png')
          scene.world.color = (0.008, 0.010, 0.018)

          bpy.ops.render.render(write_still=True)
          PY

      - name: Render probe
        run: |
          ./blender-5.2.2-linux-x64/blender --background --python probe.py
          test -s probe.png
          file probe.png

      - name: Commit probe result
        run: |
          mkdir -p global_shorts_render_lab/output
          cp probe.png global_shorts_render_lab/output/probe.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/probe.png
          git commit -m "render: Blender probe [skip ci]"
          git fetch origin global-shorts-render-lab
          git rebase origin/global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
