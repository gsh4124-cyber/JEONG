name: Motion Logic Tiny Contact

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-tiny-contact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiny-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tiny contact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p global_shorts_render_lab/output/motion_logic_quality_tiny
          ffmpeg -y -hide_banner -loglevel error \
            -i global_shorts_render_lab/output/motion_logic_quality_fast/quality_fast_60.png \
            -i global_shorts_render_lab/output/motion_logic_quality_fast/quality_fast_90.png \
            -filter_complex "[0:v]scale=90:160[a];[1:v]scale=90:160[b];[a][b]hstack=inputs=2[out]" \
            -map "[out]" -q:v 25 \
            global_shorts_render_lab/output/motion_logic_quality_tiny/contact_tiny.jpg
          ls -lh global_shorts_render_lab/output/motion_logic_quality_tiny/contact_tiny.jpg
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/motion_logic_quality_tiny/contact_tiny.jpg
          git commit -m "render: tiny Motion Logic contact [skip ci]"
          git push origin HEAD:global-shorts-render-lab
