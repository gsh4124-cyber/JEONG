name: Hidden Shift Q2 Compact Inspect

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/hidden-shift-q2-compact-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Build compact contact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ROOT=global_shorts_render_lab/output/hidden_shift_workbench_quality_v2
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa
          ffmpeg -y -hide_banner -loglevel error \
            -i "$ROOT/workbench_q2_0001.png" \
            -i "$ROOT/workbench_q2_0073.png" \
            -i "$ROOT/workbench_q2_0146.png" \
            -filter_complex "[0:v]scale=120:213[a];[1:v]scale=120:213[b];[2:v]scale=120:213[c];[a][b][c]hstack=inputs=3[out]" \
            -map "[out]" -q:v 30 "$OUT/compact_inspect.jpg"
          base64 -w0 "$OUT/compact_inspect.jpg" > "$OUT/compact_inspect.b64.txt"
          wc -c "$OUT/compact_inspect.jpg" "$OUT/compact_inspect.b64.txt"
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa/compact_inspect.jpg \
                  global_shorts_render_lab/output/hidden_shift_workbench_quality_v2_qa/compact_inspect.b64.txt
          git commit -m "qa: add compact Hidden Shift q2 inspect [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
