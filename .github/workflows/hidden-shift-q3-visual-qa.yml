name: Hidden Shift Q3 Visual QA Frames

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/hidden-shift-q3-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - name: Build exact-final QA frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          IN=global_shorts_render_lab/output/hidden_shift_workbench_q3_final/hidden_shift_workbench_q3_final.mp4
          OUT=global_shorts_render_lab/output/hidden_shift_workbench_q3_final

          ffmpeg -y -hide_banner -loglevel error -ss 0.50 -i "$IN" -frames:v 1 -vf scale=240:427 -q:v 29 /tmp/before.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 4.50 -i "$IN" -frames:v 1 -vf scale=240:427 -q:v 29 /tmp/after.jpg
          ffmpeg -y -hide_banner -loglevel error -ss 7.20 -i "$IN" -frames:v 1 -vf scale=240:427 -q:v 29 /tmp/reveal.jpg
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/before.jpg -i /tmp/after.jpg -i /tmp/reveal.jpg             -filter_complex "[0:v][1:v][2:v]hstack=inputs=3[out]"             -map "[out]" -q:v 29 "$OUT/q3_visual_qa_full.jpg"

          # Title readability + target detail from exact final MP4.
          ffmpeg -y -hide_banner -loglevel error -ss 0.50 -i "$IN" -frames:v 1             -vf "crop=1080:320:0:0,scale=540:160" -q:v 27 /tmp/title.jpg
          for spec in "before:0.50" "after:4.50" "reveal:7.20"; do
            n="${spec%%:*}"; t="${spec#*:}"
            ffmpeg -y -hide_banner -loglevel error -ss "$t" -i "$IN" -frames:v 1               -vf "crop=620:920:230:300,scale=310:460" -q:v 27 "/tmp/${n}_detail.jpg"
          done
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/title.jpg -i /tmp/before_detail.jpg -i /tmp/after_detail.jpg -i /tmp/reveal_detail.jpg             -filter_complex "[1:v][2:v][3:v]hstack=inputs=3[details];[0:v]pad=930:160:(ow-iw)/2:0:black[title];[title][details]vstack=inputs=2[out]"             -map "[out]" -q:v 27 "$OUT/q3_visual_qa_detail.jpg"

          base64 -w0 "$OUT/q3_visual_qa_full.jpg" > "$OUT/q3_visual_qa_full.b64.txt"
          base64 -w0 "$OUT/q3_visual_qa_detail.jpg" > "$OUT/q3_visual_qa_detail.b64.txt"
          sha256sum "$IN" "$OUT/q3_visual_qa_full.jpg" "$OUT/q3_visual_qa_detail.jpg" > "$OUT/q3_visual_qa_hashes.txt"

      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/hidden_shift_workbench_q3_final
          git commit -m "qa: add exact-final Q3 visual QA frames [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
