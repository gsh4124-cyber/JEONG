name: JEONG MorphMint 005 G1 Visual Readback

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jeong-morphmint-005-g1-readback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readback-thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Build compact QA thumbnail
        run: |
          test -s render_output/morphmint_005_gem_designer_g1/crystal_preview.png
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -loglevel error \
            -i render_output/morphmint_005_gem_designer_g1/crystal_preview.png \
            -vf scale=135:-1 -q:v 14 \
            render_output/morphmint_005_gem_designer_g1/qa_thumb.jpg
          base64 -w0 render_output/morphmint_005_gem_designer_g1/qa_thumb.jpg \
            > render_output/morphmint_005_gem_designer_g1/qa_thumb.b64
          test -s render_output/morphmint_005_gem_designer_g1/qa_thumb.b64

      - name: Persist QA readback
        run: |
          git config user.name "global-shorts-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add render_output/morphmint_005_gem_designer_g1/qa_thumb.jpg
          git add render_output/morphmint_005_gem_designer_g1/qa_thumb.b64
          git diff --cached --quiet && exit 0
          git commit -m "qa: persist MorphMint 005 G1 visual thumbnail"
          git push
