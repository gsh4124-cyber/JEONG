name: JEONG Global Shorts Recovery Router Smoke

on:
  workflow_dispatch:
    inputs:
      primary_blocker_evidence:
        description: 'Verified hwangje-vault Actions blocker evidence / reference'
        required: true
        type: string
      support_scope:
        description: 'diagnostic | recovery | temporary_support'
        required: true
        type: choice
        options:
          - diagnostic
          - recovery
          - temporary_support
      return_to_primary_plan:
        description: 'How the result returns to hwangje-vault primary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  support-route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert support-only contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Route support smoke batch only
        run: |
          python global_shorts_factory/queue_router.py global_shorts_factory/batch_quality_factory_smoke.json > routed_batch.json
      - name: Verify support smoke routing
        run: |
          python - <<'PY'
          import json
          d=json.load(open('routed_batch.json'))
          jobs=d['jobs']
          assert len(jobs)==5, len(jobs)
          profiles=[j['target_channel'] for j in jobs]
          assert len(set(profiles))==5, profiles
          print('JEONG_SUPPORT_ROUTER_SMOKE_PASS')
          print('NO_PRIMARY_OWNERSHIP_CLAIM')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jeong-support-routed-smoke
          path: routed_batch.json
