name: Motion Logic Transfer Tiny QA

on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/global-shorts-motion-transfer-tiny-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: global-shorts-render-lab, fetch-depth: 0}
      - name: Make tiny contacts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd global_shorts_render_lab/output/motion_logic_transfer_preview
          ffmpeg -y -hide_banner -loglevel error -i bridge_contact.jpg -vf scale=135:80 -q:v 31 bridge_contact_tiny.jpg
          ffmpeg -y -hide_banner -loglevel error -i counterweight_contact.jpg -vf scale=135:80 -q:v 31 counterweight_contact_tiny.jpg
          base64 -w0 bridge_contact_tiny.jpg > bridge_contact_tiny.b64.txt
          base64 -w0 counterweight_contact_tiny.jpg > counterweight_contact_tiny.b64.txt
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/motion_logic_transfer_preview
          git commit -m "render: add transfer tiny QA contacts [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
