name: MorphMint Method2 Micro QA
on:
  push:
    branches: [global-shorts-render-lab]
    paths:
      - ".github/workflows/morphmint-method2-micro-qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-shorts-render-lab
          fetch-depth: 0
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ROOT=global_shorts_render_lab/output/morphmint_family_c_method2
          ffmpeg -y -hide_banner -loglevel error -i "$ROOT/morphmint_m2_contact.jpg"             -vf scale=160:142 -q:v 31 "$ROOT/morphmint_m2_contact_micro.jpg"
          base64 -w0 "$ROOT/morphmint_m2_contact_micro.jpg" > "$ROOT/morphmint_m2_contact_micro.b64.txt"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_shorts_render_lab/output/morphmint_family_c_method2
          git commit -m "qa: add MorphMint method2 micro contact [skip ci]"
          git pull --rebase origin global-shorts-render-lab
          git push origin HEAD:global-shorts-render-lab
