name: JEONG MorphMint 005 Crystal Grammar QA A2

on:
  pull_request:
    branches: [main]
    paths:
      - "global_shorts_render_lab/github_public_runner/morphmint_005_crystal_cutgem_a.py"
      - ".github/workflows/jeong-morphmint-005-remote-probe.yml"
      - "jeong_morphmint_005_crystal_cutgem_a_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crystal-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1

      - name: Download Blender 5.2.2
        run: |
          mkdir -p .cache/blender
          curl -L --fail --retry 3 -o .cache/blender/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender

      - name: Render selected cut-gem crystal grammar
        env:
          EGL_PLATFORM: surfaceless
        run: |
          .cache/blender/blender-5.2.2-linux-x64/blender --background --factory-startup --python global_shorts_render_lab/github_public_runner/morphmint_005_crystal_cutgem_a.py

      - name: Verify exact still and make readable preview proof
        run: |
          test -s render_output/morphmint_005_crystal_cutgem_a2/crystal.png
          test -s render_output/morphmint_005_crystal_cutgem_a2/crystal_preview.png
          grep -q "MORPHMINT_005_CRYSTAL_CUTGEM_A2_RENDER_PASS" render_output/morphmint_005_crystal_cutgem_a2/result.json
          base64 -w0 render_output/morphmint_005_crystal_cutgem_a2/crystal_preview.png > render_output/morphmint_005_crystal_cutgem_a2/crystal_preview.b64
          test -s render_output/morphmint_005_crystal_cutgem_a2/crystal_preview.b64
          echo "JEONG_MORPHMINT_005_CRYSTAL_CUTGEM_A2_RENDER_PASS"

      - name: Persist exact QA proof to PR branch
        run: |
          git config user.name "global-shorts-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add render_output/morphmint_005_crystal_cutgem_a2/crystal.png
          git add render_output/morphmint_005_crystal_cutgem_a2/crystal_preview.png
          git add render_output/morphmint_005_crystal_cutgem_a2/crystal_preview.b64
          git add render_output/morphmint_005_crystal_cutgem_a2/result.json
          git diff --cached --quiet && exit 0
          git commit -m "render: persist MorphMint 005 cut-gem A2 QA"
          git push
