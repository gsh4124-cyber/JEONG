name: JEONG MorphMint Recovery Probe

on:
  workflow_dispatch:
    inputs:
      primary_blocker_evidence:
        description: 'Verified hwangje-vault Actions blocker evidence / reference'
        required: true
        type: string
      support_scope:
        description: 'diagnostic | recovery | temporary_support'
        required: true
        type: choice
        options:
          - diagnostic
          - recovery
          - temporary_support
      return_to_primary_plan:
        description: 'How the result returns to hwangje-vault primary'
        required: true
        type: string

permissions:
  contents: read

jobs:
  support-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate support-only contract
        run: python global_shorts_factory/factory_selfcheck.py
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1
      - name: Download Blender 5.2.2
        run: |
          mkdir -p .cache/blender
          curl -L --fail --retry 3 -o .cache/blender/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender
      - name: Render MorphMint support probe stills
        env:
          EGL_PLATFORM: surfaceless
        run: |
          .cache/blender/blender-5.2.2-linux-x64/blender --background --factory-startup --python global_shorts_render_lab/github_public_runner/morphmint_005_remote_probe.py
      - name: Verify support proof
        run: |
          test -s render_output/morphmint_005_probe/ceramic.png
          test -s render_output/morphmint_005_probe/chrome.png
          test -s render_output/morphmint_005_probe/crystal.png
          grep -q "MORPHMINT_005_PUBLIC_REMOTE_3STATE_V21_PASS" render_output/morphmint_005_probe/result.json
          echo "JEONG_MORPHMINT_SUPPORT_PROBE_PASS"
          echo "NO_REPOSITORY_WRITE_NO_PRIMARY_CLAIM"
      - name: Record support context
        run: |
          cat > render_output/morphmint_005_probe/support_context.json <<EOF
          {
            "primary_blocker_evidence": "${{ inputs.primary_blocker_evidence }}",
            "support_scope": "${{ inputs.support_scope }}",
            "return_to_primary_plan": "${{ inputs.return_to_primary_plan }}",
            "role": "SUPPORT_RECOVERY_FALLBACK_ONLY"
          }
          EOF
      - name: Upload recovery proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeong-morphmint-recovery-proof
          path: render_output/morphmint_005_probe/
