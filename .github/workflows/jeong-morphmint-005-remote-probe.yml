name: JEONG MorphMint 005 Authored Crystal C3 QA

on:
  pull_request:
    branches: [main]
    paths:
      - "global_shorts_render_lab/github_public_runner/morphmint_005_crystal_authored_c3.py"
      - "global_shorts_render_lab/assets/third_party/HANSOLOSNIPE_DIAMOND_ATTRIBUTION.md"
      - ".github/workflows/jeong-morphmint-005-remote-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authored-crystal-c3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1

      - name: Download Blender 5.2.2
        run: |
          mkdir -p .cache/blender
          curl -L --fail --retry 3 -o .cache/blender/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender

      - name: Download attributed C3 donor at runtime
        run: |
          mkdir -p global_shorts_render_lab/assets/runtime
          curl -L --fail --retry 3 \
            -o global_shorts_render_lab/assets/runtime/hansolosnipe_diamond.glb \
            https://raw.githubusercontent.com/gkjohnson/3d-demo-data/main/models/diamond/diamond.glb
          test -s global_shorts_render_lab/assets/runtime/hansolosnipe_diamond.glb
          sha256sum global_shorts_render_lab/assets/runtime/hansolosnipe_diamond.glb

      - name: Render authored round-diamond C3 still
        env:
          EGL_PLATFORM: surfaceless
        run: |
          .cache/blender/blender-5.2.2-linux-x64/blender --background --factory-startup --python global_shorts_render_lab/github_public_runner/morphmint_005_crystal_authored_c3.py

      - name: Verify exact still and preview
        run: |
          test -s render_output/morphmint_005_crystal_authored_c3/crystal.png
          test -s render_output/morphmint_005_crystal_authored_c3/crystal_preview.png
          test -s render_output/morphmint_005_crystal_authored_c3/crystal_preview.b64
          grep -q "MORPHMINT_005_CRYSTAL_AUTHORED_C3_RENDER_PASS" render_output/morphmint_005_crystal_authored_c3/result.json
          echo "JEONG_MORPHMINT_005_CRYSTAL_AUTHORED_C3_RENDER_PASS"

      - name: Persist exact QA proof to PR branch
        run: |
          git config user.name "global-shorts-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add render_output/morphmint_005_crystal_authored_c3/crystal.png
          git add render_output/morphmint_005_crystal_authored_c3/crystal_preview.png
          git add render_output/morphmint_005_crystal_authored_c3/crystal_preview.b64
          git add render_output/morphmint_005_crystal_authored_c3/result.json
          git diff --cached --quiet && exit 0
          git commit -m "render: persist MorphMint 005 authored crystal C3 QA"
          git push
