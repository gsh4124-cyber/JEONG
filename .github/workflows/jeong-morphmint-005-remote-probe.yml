name: JEONG MorphMint 005 Remote Probe

on:
  push:
    branches: [main]
    paths:
      - "global_shorts_render_lab/github_public_runner/morphmint_005_remote_probe.py"
      - ".github/workflows/jeong-morphmint-005-remote-probe.yml"
      - "jeong_morphmint_005_probe_trigger.txt"
  pull_request:
    branches: [main]
    paths:
      - "global_shorts_render_lab/github_public_runner/morphmint_005_remote_probe.py"
      - ".github/workflows/jeong-morphmint-005-remote-probe.yml"
      - "jeong_morphmint_005_probe_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1

      - name: Download Blender 5.2.2
        run: |
          mkdir -p .cache/blender
          curl -L --fail --retry 3 -o .cache/blender/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender

      - name: Render MorphMint 005 V22 cut-gem still
        env:
          EGL_PLATFORM: surfaceless
        run: |
          .cache/blender/blender-5.2.2-linux-x64/blender --background --factory-startup --python global_shorts_render_lab/github_public_runner/morphmint_005_remote_probe.py

      - name: Verify
        run: |
          test -s render_output/morphmint_005_probe/ceramic.png
          test -s render_output/morphmint_005_probe/chrome.png
          test -s render_output/morphmint_005_probe/crystal.png
          grep -q "MORPHMINT_005_PUBLIC_REMOTE_3STATE_V22_CUT_GEM_PASS" render_output/morphmint_005_probe/result.json
          echo "JEONG_MORPHMINT_005_V22_CUT_GEM_PASS"

      - name: Persist compact QA proof to PR branch
        run: |
          git config user.name "global-shorts-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add render_output/morphmint_005_probe/ceramic.png
          git add render_output/morphmint_005_probe/chrome.png
          git add render_output/morphmint_005_probe/crystal.png
          git add render_output/morphmint_005_probe/result.json
          git diff --cached --quiet && exit 0
          git commit -m "render: persist JEONG MorphMint 005 V22 cut-gem QA"
          git push
