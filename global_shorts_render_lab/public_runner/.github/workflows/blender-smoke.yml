name: Blender Public Runner Smoke

on:
  push:
    paths:
      - "runner/**"
      - ".github/workflows/blender-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 5.2.2
        run: |
          mkdir -p .cache/blender
          curl -L --fail --retry 3             -o .cache/blender/blender.tar.xz             https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf .cache/blender/blender.tar.xz -C .cache/blender

      - name: Render smoke
        run: |
          .cache/blender/blender-5.2.2-linux-x64/blender             --background --factory-startup             --python runner/smoke_scene.py

      - name: Verify outputs
        run: |
          test -s output/public_github_blender_smoke.png
          test -s output/public_github_blender_smoke.blend
          test -s output/result.json
          grep -q "PUBLIC_GITHUB_BLENDER_SMOKE_PASS" output/result.json

      - name: Keep only compact proof
        run: |
          rm -f output/public_github_blender_smoke.blend

      - name: Commit proof back to repo
        run: |
          git config user.name "global-shorts-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/public_github_blender_smoke.png output/result.json
          git diff --cached --quiet && exit 0
          git commit -m "render: public Blender smoke proof"
          git push
